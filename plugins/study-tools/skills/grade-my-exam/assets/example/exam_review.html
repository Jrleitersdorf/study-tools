<title>ARTH 101 Quiz 3 Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>try{var t=localStorage.getItem("arth101-quiz3-review-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-review-theme",t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,400&display=swap">
<style>
/* review.css  (ENGINE FILE: inlined by build_review.py; do not edit per review)
   Layout: one reading column (max 860px). A sticky bar holds the two views (Your answers, Lessons)
   and the Light/Dark switch; the score summary opens the page; question cards and lessons follow.
   Tokens match the study-guide pages so the plugin's pages look like one family. */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef1f7; --ink:#131722; --ink-2:#384050; --muted:#5f6a7e;
  --line:#dce1ea; --line-2:#c6cedb;
  --accent:#2747c7; --accent-ink:#ffffff; --accent-soft:#e8edfb; --accent-line:#b9c7f2;
  --good:#11724a; --good-soft:#e1f2e8; --bad:#ae2a1d; --bad-soft:#fbe8e5; --warn:#8f530a; --warn-soft:#fbf0dc;
  --code:#f1f4fb; --quote:#f6f3ec; --quote-line:#c9b98f;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 6px 20px rgba(20,30,60,.05);
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --surface:#151922; --surface-2:#1b2130; --ink:#e6e9ef; --ink-2:#c4cad6; --muted:#8f98aa;
    --line:#29303d; --line-2:#3a4354;
    --accent:#8fa8ff; --accent-ink:#0e1116; --accent-soft:#1b2544; --accent-line:#34457a;
    --good:#62cf98; --good-soft:#112a1e; --bad:#ff8f80; --bad-soft:#311714; --warn:#f0b55e; --warn-soft:#2c2111;
    --code:#131a28; --quote:#1d1b16; --quote-line:#6d6247;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#151922; --surface-2:#1b2130; --ink:#e6e9ef; --ink-2:#c4cad6; --muted:#8f98aa;
  --line:#29303d; --line-2:#3a4354;
  --accent:#8fa8ff; --accent-ink:#0e1116; --accent-soft:#1b2544; --accent-line:#34457a;
  --good:#62cf98; --good-soft:#112a1e; --bad:#ff8f80; --bad-soft:#311714; --warn:#f0b55e; --warn-soft:#2c2111;
  --code:#131a28; --quote:#1d1b16; --quote-line:#6d6247;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
html:root[data-review-theme="light"]{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef1f7; --ink:#131722; --ink-2:#384050; --muted:#5f6a7e;
  --line:#dce1ea; --line-2:#c6cedb;
  --accent:#2747c7; --accent-ink:#ffffff; --accent-soft:#e8edfb; --accent-line:#b9c7f2;
  --good:#11724a; --good-soft:#e1f2e8; --bad:#ae2a1d; --bad-soft:#fbe8e5; --warn:#8f530a; --warn-soft:#fbf0dc;
  --code:#f1f4fb; --quote:#f6f3ec; --quote-line:#c9b98f;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 6px 20px rgba(20,30,60,.05);
  color-scheme:light;
}
html:root[data-review-theme="dark"]{
  --bg:#0e1116; --surface:#151922; --surface-2:#1b2130; --ink:#e6e9ef; --ink-2:#c4cad6; --muted:#8f98aa;
  --line:#29303d; --line-2:#3a4354;
  --accent:#8fa8ff; --accent-ink:#0e1116; --accent-soft:#1b2544; --accent-line:#34457a;
  --good:#62cf98; --good-soft:#112a1e; --bad:#ff8f80; --bad-soft:#311714; --warn:#f0b55e; --warn-soft:#2c2111;
  --code:#131a28; --quote:#1d1b16; --quote-line:#6d6247;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0;color:var(--ink)}
p{margin:0}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kicker{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lbl{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .brand{display:flex;flex-direction:column;min-width:0;flex:1 1 180px}
.top .brand b{font-family:var(--serif);font-weight:600;font-size:1rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand span{font-family:var(--mono);font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.tabs a{text-decoration:none;color:var(--ink-2);font-size:.86rem;font-weight:500;padding:5px 12px;border-radius:7px;white-space:nowrap}
.tabs a .n{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-left:5px}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.themesw{display:inline-flex;border:1px solid var(--line-2);border-radius:99px;overflow:hidden;flex:none}
.themesw button{border:0;background:transparent;color:var(--muted);font-family:var(--mono);font-size:.72rem;padding:4px 11px;cursor:pointer}
.themesw button+button{border-left:1px solid var(--line-2)}
.themesw button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 120px;display:flex;flex-direction:column;gap:28px}

/* ---------- summary ---------- */
.sum{display:flex;flex-direction:column;gap:20px}
.sum-head{display:flex;flex-direction:column;gap:6px}
.sum-head h1{font-size:clamp(1.6rem,4.4vw,2.2rem);line-height:1.15}
.sum-head .sub{color:var(--ink-2);max-width:62ch}
.scorebox{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.score{padding:20px 22px;display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--line);min-width:0}
.score .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big .num{font-family:var(--serif);font-weight:600;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.score .big .num small{font-size:1.4rem;color:var(--muted);margin-left:2px}
.score .big .num small.about{font-family:var(--sans);font-size:.95rem;font-weight:500;margin:0 6px 0 0;letter-spacing:0;vertical-align:.9em}
.score .big .rng{color:var(--ink-2);font-size:.98rem}
.score .pts{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.rbar{position:relative;height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);margin:4px 0 16px}
.rbar .band{position:absolute;top:-1px;bottom:-1px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:99px}
.rbar .pin{position:absolute;top:-5px;width:3px;height:18px;margin-left:-1.5px;background:var(--accent);border-radius:2px}
.rbar .tick{position:absolute;top:14px;font-family:var(--mono);font-size:.62rem;color:var(--muted);transform:translateX(-50%)}
.rbar .tick:first-child{transform:none}.rbar .tick:last-child{transform:translateX(-100%)}
.tally{list-style:none;margin:0;padding:12px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;align-content:center}
.tally li{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:9px;background:var(--surface-2);min-width:0}
.tally li b{font-family:var(--serif);font-weight:600;font-size:1.45rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tally li span{font-size:.8rem;color:var(--muted)}
.tally li.good b{color:var(--good)}.tally li.part b{color:var(--warn)}.tally li.bad b{color:var(--bad)}.tally li.uns b{color:var(--accent)}
.tally li.wide{grid-column:1 / -1;flex-direction:row;align-items:baseline;gap:8px}
.tally li.wide b{font-size:1.05rem}
.note{font-size:.88rem;color:var(--ink-2);padding:10px 14px;border-left:3px solid var(--line-2);background:var(--surface);border-radius:0 8px 8px 0;max-width:72ch}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note b{color:var(--ink)}

.gaps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.panel{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:1.06rem}
.ubars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ubars li{display:flex;flex-direction:column;gap:4px;min-width:0}
.ubars .row{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.ubars .row span:last-child{font-family:var(--mono);font-size:.76rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ubars .bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.ubars .bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.ubars .bar i.mid{background:var(--warn)}.ubars .bar i.low{background:var(--bad)}
.habits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.habits li a{display:flex;gap:10px;align-items:baseline;justify-content:space-between;text-decoration:none;color:var(--ink);padding:7px 8px;margin:0 -8px;border-radius:8px}
.habits li a:hover{background:var(--surface-2)}
.habits li .h{font-size:.9rem;min-width:0}
.habits li .m{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap;flex:none}
.panel.how{gap:8px;background:transparent;border-style:dashed}
.panel.how h2{font-size:.98rem}
.panel.how ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--ink-2)}
.panel.how b{color:var(--ink)}

/* ---------- answers toolbar ---------- */
.view{display:flex;flex-direction:column;gap:16px}
.view-head{display:flex;flex-direction:column;gap:4px}
.view-head h2{font-size:1.35rem}
.view-head p{color:var(--ink-2);font-size:.92rem}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:4px 11px;font-size:.84rem;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.chip .n{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:var(--bg);opacity:.75}
.chip:disabled{opacity:.45;cursor:default}
.sortbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:4px 11px;font-size:.84rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sortbtn[aria-pressed="true"]{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.sortbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:12px}
.cards{display:flex;flex-direction:column;gap:14px}

/* ---------- question card ---------- */
.qcard{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:16px 18px 14px;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative}
.qcard::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--line-2)}
.qcard[data-v="right"]::before{background:var(--good)}
.qcard[data-v="partial"]::before{background:var(--warn)}
.qcard[data-v="wrong"]::before,.qcard[data-v="blank"]::before{background:var(--bad)}
.qc-h{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.qc-h .qn{font-family:var(--serif);font-weight:600;font-size:1.12rem}
.qc-h .qt{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.qc-h .sp{flex:1 1 auto}
.verdict{font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.verdict small{font-weight:400;font-family:var(--mono);font-size:.72rem;margin-left:5px}
.v-right{color:var(--good);background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.v-partial{color:var(--warn);background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.v-wrong,.v-blank{color:var(--bad);background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.badge{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:99px;white-space:nowrap;border:1px solid var(--line-2);color:var(--muted)}
.badge.conf{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.badge.est{border-style:dashed}
.stem{display:flex;flex-direction:column;gap:10px;min-width:0}
.rt{display:flex;flex-direction:column;gap:8px;min-width:0}
.rt ul,.rt ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:3px}
.rt code{font-family:var(--mono);font-size:.9em;background:var(--code);border:1px solid var(--line);border-radius:4px;padding:0 4px}
pre.code{margin:0;font-family:var(--mono);font-size:.84rem;line-height:1.5;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;tab-size:4;max-width:100%}
pre.code code{font-family:inherit;background:none;border:0;padding:0;font-size:inherit}
.mathwrap{overflow-x:auto;overflow-y:hidden;max-width:100%}
mjx-container.wide{display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:bottom}
figure.fig{margin:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:100%}
figure.fig img{max-width:min(100%,560px);height:auto;border-radius:8px;border:1px solid var(--line);background:#fff}
figure.fig figcaption{font-size:.8rem;color:var(--muted)}

.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.opt .k{font-family:var(--mono);font-size:.78rem;color:var(--muted);padding-top:2px;min-width:1.2em}
.opt .t{min-width:0}
.opt .marks{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.opt .mk{font-family:var(--mono);font-size:.64rem;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:99px;white-space:nowrap}
.mk.you{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2)}
.mk.key{background:var(--good-soft);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 35%,transparent)}
.mk.miss{background:transparent;color:var(--good);border:1px dashed var(--good)}
.opt.ok{border-color:color-mix(in srgb,var(--good) 55%,transparent);background:var(--good-soft)}
.opt.no{border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:var(--bad-soft)}
.opt.missed{border-style:dashed;border-color:var(--good)}

.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pair.one{grid-template-columns:minmax(0,1fr)}
.ans{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ans.you{background:var(--surface-2)}
.ans.key{background:color-mix(in srgb,var(--good-soft) 55%,var(--surface));border-color:color-mix(in srgb,var(--good) 25%,var(--line))}
.ans .lbl{display:flex;justify-content:space-between;gap:8px}
.choice-line{font-size:.9rem;color:var(--ink-2)}
.choice-line b{color:var(--ink)}
.snote{display:flex;gap:8px;align-items:baseline;font-size:.9rem;background:var(--quote);border-left:3px solid var(--quote-line);padding:7px 12px;border-radius:0 8px 8px 0}
.snote .lbl{flex:none}
.why{display:flex;flex-direction:column;gap:6px}
.dispute{border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.dispute .lbl{color:var(--warn)}
.rubric{width:100%;border-collapse:collapse;font-size:.88rem}
.rubric-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.rubric th,.rubric td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.rubric tr:last-child td{border-bottom:0}
.rubric th{font-family:var(--mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface-2)}
.rubric td.m{font-family:var(--mono);font-size:.8rem;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.rubric td.m.full{color:var(--good)}.rubric td.m.part{color:var(--warn)}.rubric td.m.none{color:var(--bad)}
.rubric .c{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:.76rem;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);text-decoration:none;white-space:nowrap}
a.tag:hover{border-color:var(--accent-line);color:var(--accent)}
.qc-foot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.linkbtn{border:0;background:none;color:var(--accent);font-size:.84rem;cursor:pointer;padding:2px 0;font-weight:500}
.linkbtn:hover{text-decoration:underline}

details.walk{border:1px solid var(--accent-line);border-radius:10px;background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
details.walk>summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:.92rem;color:var(--accent);list-style:none;display:flex;align-items:center;gap:8px}
details.walk>summary::-webkit-details-marker{display:none}
details.walk>summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:2px}
details.walk[open]>summary::before{transform:rotate(45deg)}
.wk{padding:2px 14px 14px;display:flex;flex-direction:column;gap:12px}
.wk-s{display:flex;flex-direction:column;gap:5px}
.wk-s ol.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.wk-s.answer .rt{font-weight:600}
.wk-s.trap{border-top:1px dashed var(--accent-line);padding-top:10px}

/* ---------- lessons ---------- */
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;counter-reset:l}
.lesson{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lesson-h{display:flex;flex-direction:column;gap:4px}
.lesson-h h3{font-size:1.2rem;line-height:1.3}
.lesson-h .fx{font-size:.78rem;color:var(--muted);margin-left:6px}
.lesson-h .for{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ls{display:flex;flex-direction:column;gap:6px}
.ls h4{font-family:var(--sans);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lex{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.lex .q{font-weight:500}
.lex .s{border-top:1px solid var(--line-2);padding-top:10px}
.ltrap{border-left:3px solid var(--bad);background:var(--bad-soft);border-radius:0 9px 9px 0;padding:9px 12px;display:flex;flex-direction:column;gap:4px}
.ltrap h4{color:var(--bad)}
.fixes{border:1px solid var(--accent-line);border-radius:13px;background:var(--accent-soft);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.fixes h2{font-size:1.2rem}
.fixes ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}

/* ---------- ask ---------- */
.qa{display:flex;flex-direction:column;gap:10px}
.qa[hidden]{display:none}
.qa>.lbl{margin-top:2px}
.thread{border:1px solid var(--accent-line);border-radius:10px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;flex-direction:column;gap:3px}
.msg .who{font-family:var(--mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.msg.q .rt{font-weight:500}
.msg.a{padding-left:10px;border-left:2px solid var(--accent-line)}
.msg.wait .rt{color:var(--muted)}
.th-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.th-acts input{flex:1 1 200px;min-width:0;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;background:var(--surface);color:var(--ink);font:inherit;font-size:.88rem}
.btn{font-size:.84rem;font-weight:500;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:5px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink-2)}
.th-note{font-size:.8rem;color:var(--muted)}
.th-err{font-size:.82rem;color:var(--bad)}
.ask-wrap{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-width:calc(100vw - 32px)}
.ask-fab{display:flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:9px 16px 9px 14px;font-size:.88rem;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:100%}
.ask-fab b{font-weight:700}
.ask-fab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.ask-fab svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8}
.ask-pop{width:min(400px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.22);padding:14px;display:flex;flex-direction:column;gap:10px}
.ap-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ap-head label{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--ink-2)}
.ap-head input{width:7em;border:1px solid var(--line-2);border-radius:7px;padding:4px 8px;background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:.86rem}
.ap-x{border:0;background:none;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;padding:0 4px}
.ask-pop textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;background:var(--surface);color:var(--ink);font:inherit;font-size:.92rem}
.ap-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ap-err{font-size:.82rem;color:var(--bad)}
.ap-note{font-size:.8rem;color:var(--muted)}
.ask-wrap.save-only .ask-now{display:none}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent-line)}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- narrow screens ---------- */
@media (max-width:700px){
  .scorebox{grid-template-columns:minmax(0,1fr)}
  .score{border-right:0;border-bottom:1px solid var(--line)}
  .tally{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gaps{grid-template-columns:minmax(0,1fr)}
  .pair{grid-template-columns:minmax(0,1fr)}
  .top .brand{display:none}
  .top-in{gap:10px;flex-wrap:nowrap}
  .tabs{flex:1 1 auto;min-width:0}
  .tabs a{flex:1 1 auto;text-align:center;padding:5px 8px}
  .themesw button{padding:4px 8px}
  .wrap{padding-block:20px 120px}
  .ask-fab{padding:8px 14px 8px 12px}
  .ask-fab span{max-width:120px}
  .qcard,.lesson{padding:14px 14px 12px}
  .score .big .num{font-size:2.7rem}
}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

ls of the Florence Baptistery around 1415 to 1420?","options":[{"key":"A","text":"Masaccio"},{"key":"B","text":"Filippo Brunelleschi"},{"key":"C","text":"Lorenzo Ghiberti"},{"key":"D","text":"Leon Battista Alberti"}],"answer":{"choice":"B"},"correct":{"choice":"B"},"verdict":"right","earned":2,"confidence":"solid","explanation":"Brunelleschi made the demonstration with a panel of the Baptistery viewed through a hole and a mirror. Alberti wrote the method down later, in *On Painting* (1435), and Masaccio was the first painter to build a large fresco on it."},{"id":"2","type":"mc","points":2,"unit":"u3","habits":["h2"],"prompt":"In which church is Masaccio's fresco of the *Holy Trinity* (about 1427)?","options":[{"key":"A","text":"Santa Maria Novella"},{"key":"B","text":"Santa Croce"},{"key":"C","text":"San Lorenzo"},{"key":"D","text":"Santa Maria del Carmine (the Brancacci Chapel)"}],"answer":{"choice":"D"},"correct":{"choice":"A"},"verdict":"wrong","earned":0,"confidence":"unsure","student_note":"unsure, I remember Brancacci from lecture","explanation":"The *Holy Trinity* is on the left aisle wall of Santa Maria Novella. The Brancacci Chapel in Santa Maria del Carmine holds Masaccio's other famous work, the fresco cycle with the *Tribute Money*.","walkthrough":{"think":"Each major Masaccio work has its own building. Recall the work, then its home, and do not let the more famous chapel answer for both.","steps":["Name Masaccio's two key Florentine commissions: the *Holy Trinity* and the Brancacci Chapel frescoes.","Attach each to its church: *Holy Trinity* in Santa Maria Novella; the Brancacci Chapel inside Santa Maria del Carmine.","Option D names the second pair, so it answers a different question."],"answer":"A, Santa Maria Novella.","trap":"The option that names a famous Masaccio location is tempting precisely because it is real. Check that the place belongs to the work in the question."}},{"id":"3","type":"multi","points":2,"unit":"u1","habits":["h4"],"format":"Select all that apply","prompt":"Which of the following are features of one-point linear perspective as Early Renaissance painters used it? Select all that apply.","options":[{"key":"A","text":"Lines that run straight into the picture converge at a single vanishing point."},{"key":"B","text":"The vanishing point lies on the horizon line, which is set at the viewer's eye level."},{"key":"C","text":"The most important figures are painted larger than the others."},{"key":"D","text":"Objects shrink at a regular rate as they recede."}],"answer":{"choice":["A","D"]},"correct":{"choice":["A","B","D"]},"verdict":"wrong","earned":0,"confidence":"solid","explanation":"A, B and D all describe the system. C describes hierarchical scale, an older convention in which size shows importance, not distance. Under the all-or-nothing rule, missing B costs the whole item.","walkthrough":{"think":"A select-all item is several true/false questions in one. Judge each option on its own, and do not stop once the answer looks complete.","steps":["A: the single vanishing point is the defining feature. True.","B: the vanishing point sits on the horizon, and the horizon is placed at eye level so the viewer seems to stand in the scene. True.","C: size by importance is hierarchical scale, which perspective replaces. False.","D: regular diminution with distance is what the converging lines produce. True."],"answer":"A, B and D.","trap":"B sounds like a technical detail rather than a feature, so it is easy to skip. Detail is not a reason to leave a true statement out."}},{"id":"4","type":"tf","points":3,"unit":"u2","habits":["h2"],"format":"True/false with justification","prompt":"True or false, with one sentence of justification: Ghiberti's *Gates of Paradise* (the east doors of the Florence Baptistery) use the same quatrefoil frames as his 1401 competition panel.","answer":{"choice":"T","text":"Ghiberti reused his design from the competition he won."},"correct":{"choice":"F","text":"False: the quatrefoil frames belong to the competition panel and the north doors, while the *Gates of Paradise* use ten large square panels in perspective."},"verdict":"wrong","earned":0,"confidence":"solid","explanation":"Ghiberti made two sets of Baptistery doors. The north doors (1403 to 1424) keep the quatrefoil frames of the competition panel; the east doors (1425 to 1452) drop them for ten square fields with deep perspective settings.","walkthrough":{"think":"When a statement links two works by one artist, test whether the detail really belongs to both. Most true/false traps of this kind swap a feature between neighbours.","steps":["List Ghiberti's doors in order: competition panel (1401), north doors (1403 to 1424), east doors, the *Gates of Paradise* (1425 to 1452).","Recall the frame of each: quatrefoils for the panel and the north doors; ten squares for the east doors.","The claim gives the east doors the quatrefoils, so it is false.","Write the justification as the contrast: name what each set actually uses."],"answer":"False. The quatrefoils belong to the competition panel and the north doors; the *Gates of Paradise* use ten square panels.","trap":"Knowing that Ghiberti won the competition makes \"reused his design\" sound plausible. The justification must name a feature of the work, not a story about the artist."}},{"id":"5","type":"tf","points":3,"unit":"u1","habits":[],"format":"True/false with justification","prompt":"True or false, with one sentence of justification: In *On Painting* (1435), Alberti compares the picture to an open window through which the subject is seen.","answer":{"choice":"T","text":"Alberti says the painting is like an open window onto the scene."},"correct":{"choice":"T","text":"True: Alberti describes the picture surface as an open window through which the istoria (the story) is seen."},"verdict":"right","earned":3,"confidence":"solid","explanation":"The open window is Alberti's central image for the picture plane, and it is the reason the painted space must follow perspective."},{"id":"6","type":"mc","points":2,"unit":"u2","habits":[],"prompt":"What does *contrapposto* describe?","options":[{"key":"A","text":"A standing figure with its weight on one leg, so that the hips and shoulders tilt in opposite directions"},{"key":"B","text":"The contrast of light and dark used to model a form"},{"key":"C","text":"A relief carved so shallowly that it is almost flat"},{"key":"D","text":"A figure shown from a steep angle below"}],"answer":{"choice":"A"},"correct":{"choice":"A"},"verdict":"right","earned":2,"confidence":"guessed","student_note":"guessed, picked A because it sounded right","explanation":"Contrapposto is the weight shift of classical sculpture that Donatello revived. B is chiaroscuro, C is schiacciato (very low relief) and D is foreshortening seen from below.","walkthrough":{"think":"Four Italian terms describe four different things: posture, light, relief depth and viewpoint. Tie each term to one of them.","steps":["Contrapposto (\"set against\"): the body's parts are set against one another; it describes posture.","Chiaroscuro (\"light-dark\"): modelling with light and shadow, option B.","Schiacciato (\"flattened\"): Donatello's very low relief, option C.","A view from steeply below is foreshortening, option D."],"answer":"A.","trap":"All four options are real terms from the same weeks of the course, so recognising a term is not enough; match its literal meaning."}},{"id":"7","type":"written","points":4,"unit":"u3","habits":["h1"],"format":"Short answer","prompt":"In two to four sentences, explain how Masaccio's *Tribute Money* (Brancacci Chapel, about 1425) uses continuous narrative.","answer":{"text":"The fresco tells the story in more than one scene at once. Peter appears twice, once with Christ and once paying the tax collector, so we read it as a sequence. This makes the story clear."},"correct":{"text":"Continuous narrative shows several moments of one story in a single setting, with the sa AAMIoAAAAAAAAAGEUAAAAAAAAACCMAgAAAAAAABBGAQAAAAAAAADCKAAAAAAAAKA0/n8/juWNuM6byQAAAABJRU5ErkJggg==","alt":"A tiled floor drawn in one-point perspective: lines marked o run into the picture and meet at a point V on a dashed horizon line H; lines marked t run across, closer together as they recede.","caption":"Diagram for question 8 (drawn for this example).","width":900,"height":540},"answer":{"text":"(a) Linear perspective\n\n(b) The horizon point\n\n(c) Transversals\n\n(d) Masaccio, *Holy Trinity*"},"correct":{"text":"(a) One-point linear perspective.\n\n(b) The vanishing point (Alberti's centric point), which lies on the horizon line.\n\n(c) Orthogonals: lines perpendicular to the picture plane that converge at the vanishing point.\n\n(d) Masaccio, *Holy Trinity* (Santa Maria Novella); also accepted: Ghiberti's *Gates of Paradise* panels."},"verdict":"partial","earned":{"low":2,"likely":2,"high":3},"confidence":"solid","explanation":"Parts (a) and (d) are right. The lines marked o run into the picture toward V, so they are orthogonals; transversals are the lines marked t that run across. \"Horizon point\" describes where V is but is not the term.","rubric":[{"point":"(a) One-point linear perspective","marks":1,"got":1},{"point":"(b) Vanishing point","marks":1,"got":0,"comment":"Some instructors accept \"centric point\"; \"horizon point\" is less likely to earn it, hence the high end of 3."},{"point":"(c) Orthogonals","marks":1,"got":0,"comment":"Swapped with transversals."},{"point":"(d) A Florentine work built on it","marks":1,"got":1}],"walkthrough":{"think":"Identify each label by what the line does: does it run into the picture or across it? Then use the exact term.","steps":["The whole grid shrinks toward one point: one-point linear perspective.","V is where the receding lines meet: the vanishing point. It lies on H, the horizon line.","The o lines run into depth and meet at V: orthogonals. The t lines run across, parallel to the picture plane: transversals.","Name a work: Masaccio's *Holy Trinity*."],"answer":"(a) One-point linear perspective, (b) vanishing point, (c) orthogonals, (d) Masaccio, *Holy Trinity*.","trap":"*Ortho-* means at right angles to the picture plane, so orthogonals go into the picture. *Trans-* means across."}},{"id":"9","type":"written","points":10,"unit":["u1","u2","u3"],"habits":["h1"],"format":"Essay","prompt":"Essay (about 20 minutes). Was the Early Renaissance in Florence driven more by the revival of classical antiquity or by new ways of observing nature? Take a position and support it with at least two specific works.","answer":{"text":"I think the Early Renaissance was driven more by the revival of antiquity, because artists like Brunelleschi and Donatello went to Rome to study ancient ruins and brought those ideas back to Florence.\n\nBrunelleschi's dome shows this because it is a huge achievement that was inspired by the Pantheon. Donatello's David is also classical because it is a nude statue like the ones from ancient times. These works show proportion and harmony which were classical values.\n\nAlthough artists did look at nature, the classical ideas were more important overall, so antiquity was the main driver."},"correct":{"text":"A strong answer takes a clear position and argues it through specific features of at least two works. For example: antiquity supplied the vocabulary, but observation drove the change. Donatello's bronze *David* revives the classical nude and contrapposto, yet its slack, adolescent body is closely observed rather than idealised. Masaccio's *Holy Trinity* frames its figures in a Roman coffered barrel vault, but the vault exists to demonstrate a perspective system built from optics and measurement, and the figures are lit from a single source. In both works the classical form is the occasion and the observed space and body are the innovation. The opposite thesis can earn full marks too, if it is argued from features of the works in the same way."},"verdict":"partial","earned":{"low":5,"likely":6,"high":7},"confidence":"unsure","student_note":"ran out of time, conclusion is rushed","explanation":"The essay has a clear thesis and two relevant works, which earns the thesis and organisation marks. It loses most of the evidence and analysis marks because it never describes what in the dome or the *David* is classical, and it does not engage the other side beyond one sentence.","rubric":[{"point":"Thesis: a clear, arguable position on the question","marks":2,"got":2},{"point":"Evidence: specific features of at least two works","marks":4,"got":2,"comment":"Works named, features missing: say what is classical (the ribs and lantern of the dome, the contrapposto and bronze nude of the *David*)."},{"point":"Analysis: explains how the evidence supports the thesis and answers the other side","marks":3,"got":1,"comment":"\"Proportion and harmony\" is asserted, not shown; nature is dismissed in one clause."},{"point":"Organisation: introduction, body, conclusion","marks":1,"got":1}],"walkthrough":{"think":"An essay grade rides on evidence and analysis. A thesis with two named works is a third of the marks; each claim needs a visible feature and a sentence on why it matters.","steps":["Spend two minutes on a plan: thesis, two works, one feature of each, one counter-point.","For each work, write three sentences: the feature you can see, how it is classical or observed, and how that supports the thesis.","Take the other side seriously for two or three sentences, then answer it.","Leave three minutes for a conclusion that restates the thesis in terms of the evidence."],"answer":"Keep the thesis, then rebuild the body around specific features. See the model answer for one way.","trap":"\"It is a huge achievement\" and \"it is classical\" are conclusions, not evidence. If a sentence would fit any famous work, it earns nothing."}},{"id":"10","type":"mc","points":2,"unit":"u2","habits":["h5"],"prompt":"Over which years was Brunelleschi's dome of Florence Cathedral built (not counting the lantern)?","options":[{"key":"A","text":"1401–1415"},{"key":"B","text":"1420–1436"},{"key":"C","text":"1440–1456"},{"key":"D","text":"1475–1490"}],"answer":{"choice":"C"},"correct":{"choice":"B"},"verdict":"wrong","earned":0,"confidence":"unsure","student_note":"between B and C","explanation":"Work on the dome began in 1420 and the dome was closed in 1436, when the cathedral was consecrated. Brunelleschi died in 1446, so a construction period ending in 1456 cannot be his.","walkthrough":{"think":"Use anchor dates you are sure of and rule out options that contradict them, instead of recalling the range directly.","steps":["Anchor: Brunelleschi's perspective demonstration is about 1415 to 1420, and he died in 1446.","A ends in 1415, before the dome was even commissioned in its final form. Rule it out.","C ends in 1456, ten years after his death. Rule it out; D is later still.","B, 1420 to 1436, fits between the anchors."],"answer":"B, 1420 to 1436.","trap":"Options one or two decades apart all look plausible in isolation. A death date or a neighbouring event settles them in seconds."}}],"lessons":[{"id":"L1","title":"Evidence is what you can point to","habits":["h1"],"questions":["9","7"],"idea":"Graders give marks for features of the work, not for opinions about it. A claim such as \"the *David* is classical\" only counts once it names something visible: the contrapposto, the nude bronze body, the hat and boots that break the classical model.","how":"For every work you cite, write three moves: the feature (what and where), the category it belongs to (classical, observed, technical), and the link back to your argument. If a sentence would fit any famous work, replace it with one that fits only this one.","example":{"prompt":"Rewrite the weak claim \"Ghiberti's *Gates of Paradise* are very realistic\" as evidence for the thesis that observation drove the Early Renaissance.","solution":"In the *Jacob and Esau* panel, Ghiberti sets the figures in a hall whose floor and arches recede to one vanishing point, and the relief grows shallower toward the back so that distant figures blur as they would to the eye. The space is measured and the depth is observed, which is the sense in which the doors are \"realistic\" and why they support the thesis."},"trap":"Long, confident sentences without a single visible feature. Length does not earn evidence marks."},{"id":"L2","title":"Give each work its place and its neighbour","habits":["h2"],"questions":["2","4"],"idea":"Several artists made two famous works in or near the same place, and exam options exploit exactly that. Learn each pair together, with the one feature that separates them.","how":"Keep a two-column card for every pair: work, place, date, distinguishing feature. When an option names a real place or feature, ask which member of the pair it belongs to before accepting it.","example":{"prompt":"Donatello made a marble *David* (1408 to 1409) and a bronze *David* (1440s). Which one is the free-standing nude, and how would you justify it in one sentence?","solution":"The bronze. The marble *David* is clothed and was made for the cathedral, while the bronze is the first free-standing nude male statue since antiquity, shown in contrapposto with a hat and boots."},"trap":"Recognising the place is not the same as matching it. The most familiar option is often the neighbour."},{"id":"L3","title":"Name perspective lines by what they do","habits":["h3"],"questions":["8","3"],"idea":"The vocabulary of perspective has four terms, each tied to a direction. Orthogonals run into the picture and meet at the vanishing point; transversals run across, parallel to the picture plane; the vanishing point lies on the horizon line, which is set at the viewer's eye level.","how":"Before naming a line, ask which way it runs: into depth, or across. Then use the root of the word: *ortho-* is at right angles to the picture plane, *trans-* is across it.","example":{"prompt":"In a painting of a long colonnade, the tops of the columns form a line that slopes down toward the centre of the picture. Name that line and the point where it ends.","solution":"It runs into depth, so it is an orthogonal, and it ends at the vanishing point on the horizon line."},"trap":"Transversals get closer together as they recede, which makes them look like the \"perspective\" lines. They are not the ones that converge."},{"id":"L4","title":"Treat select-all as separate true/false items","habits":["h4"],"questions":["3"],"idea":"Under all-or-nothing credit, a select-all item is lost by one omission. Each option is its own true/false question, and a technical-sounding option is as likely to be true as a central one.","how":"Mark T or F next to every option before choosing. Count your Ts at the end; if you have only the obvious ones, reread the remaining options once more.","example":{"prompt":"Which are features of Gothic cathedral architecture? A. Pointed arches. B. Flying buttresses. C. Round arches on thick walls. D. Ribbed vaults.","solution":"A: T. B: T. C: F, that is Romanesque. D: T. Answer: A, B and D."},"trap":"Stopping after the first two confident picks. The third true option is the one the item is testing."},{"id":"L5","title":"Pin dates to a few anchors","habits":["h5"],"questions":["10"],"idea":"You do not need every date; you need a few you are sure of. Brunelleschi's perspective demonstration (about 1415 to 1420), Masaccio's death (1428), Alberti's *On Painting* (1435) and Brunelleschi's death (1446) bracket most of this unit.","how":"For a date question, place each option against the anchors and strike any that contradict them. One that ends after the artist died is out.","example":{"prompt":"Could Masaccio have read Alberti's *On Painting* before painting the *Holy Trinity*?","solution":"No. Masaccio died in 1428 and *On Painting* dates from 1435. The *Holy Trinity* (about 1427) uses perspective learned from Brunelleschi, before Alberti wrote it down."},"trap":"Options a decade or two apart all feel plausible. Check them against a death date instead of against a feeling."},{"id":"L6","title":"Plan an essay before writing it","habits":["h1"],"questions":["9"],"idea":"In a timed essay, most marks sit in evidence and analysis, and both depend on choosing features before you start. Two minutes of planning saves the rushed ending.","how":"Write a four-line plan: thesis; work 1 and its feature; work 2 and its feature; the other side and your answer. Give each body paragraph three moves: feature, meaning, link to the thesis.","example":{"prompt":"Plan, in four lines, an essay on whether Donatello was more a classical or a naturalistic sculptor.","solution":"Thesis: classical in form, naturalistic in effect. Work 1: bronze *David*, classical nude in contrapposto, yet an observed adolescent body. Work 2: *Saint Mark* at Orsanmichele, contrapposto under drapery that follows the weight of the body. Other side: the classical nude is itself a revival; answer: Donatello uses it to show a real body, not an ideal."},"trap":"Writing until time runs out with no plan. The conclusion suffers first, then the analysis."},{"id":"L7","title":"A guessed answer is a weak spot","habits":[],"questions":["6"],"idea":"A correct guess earns points on this attempt only. Studio and sculpture terms (contrapposto, chiaroscuro, schiacciato, foreshortening) come back on every exam in this course.","how":"Tie each term to its literal meaning and to one work: contrapposto, \"set against\", Donatello's *David*; chiaroscuro, \"light-dark\"; schiacciato, \"flattened\", Donatello's low reliefs; foreshortening, a form seen end-on.","example":{"prompt":"A relief is carved so shallowly that the background figures are only scratched into the stone. Which term fits?","solution":"Schiacciato, \"flattened\" relief, which Donatello used to suggest distance with very little depth."},"trap":"Picking the option that \"sounds right\" works once. Without the meaning, the next variation of the question goes the other way."}],"fixes":["For every work you cite, name one feature a viewer could point to.","Learn works in pairs (same artist or same place) with the one detail that separates them.","Name perspective lines by direction: into the picture is orthogonal, across is transversal.","Mark every select-all option T or F before you choose.","Check date options against anchors you know, such as a death date.","Spend the first two minutes of an essay on a four-line plan."],"summary":{"points_total":34,"low":15.5,"likely":17,"high":19.5,"pct_low":46,"pct_likely":50,"pct_high":57,"estimated":true,"estimated_ids":["7","8","9"],"counts":{"right":3,"partial":3,"wrong":4,"blank":0,"unsure":4,"flagged":4,"guessed_right":["6"]},"units":[{"id":"u1","name":"Perspective and Alberti","earned":9.0,"possible":14.33},{"id":"u2","name":"Sculpture and architecture","earned":4.0,"possible":10.33},{"id":"u3","name":"Masaccio and narrative painting","earned":4.0,"possible":9.33}],"habits":[{"id":"h1","name":"Claims without visual evidence","questions":["7","9"],"lost":6,"lesson":"L1"},{"id":"h2","name":"Two works of one artist or place mixed up","questions":["2","4"],"lost":5,"lesson":"L2"},{"id":"h3","name":"Perspective terms swapped","questions":["8"],"lost":2,"lesson":"L3"},{"id":"h4","name":"Incomplete select-all answers","questions":["3"],"lost":2,"lesson":"L4"},{"id":"h5","name":"Dates a decade or two late","questions":["10"],"lost":2,"lesson":"L5"}],"has_math":false}}</script>
<script>
/* review.js  (ENGINE FILE: inlined by build_review.py; do not edit per review)
   Renders the exam review page from the JSON in <script id="review-data"> (fields: review.html).
   Views: "Your answers" (score summary, filter chips, Wrong-first sort, one card per question with
   a walkthrough for every miss) and "Lessons" (ordered lessons, then the habits list). The hash
   selects the view: #answers, #lessons, #q-<id> (a question card), #lesson-<id> (a lesson).
   Ask: a floating button follows the card or lesson on screen, or takes a typed target ("7", "L3").
   Questions are saved under that item, answered with claude.use('sample'), and take follow-ups.
   Storage: db collection "questions" when the page has the db capability, otherwise localStorage
   (<storage_key>-asks). Without the sample capability Ask only saves.
   Gotchas: sample() messages must alternate user/assistant and end on a user turn; math is typeset
   only once its view is visible (MathJax measures the page); every localStorage call is guarded. */
(function () {
  'use strict';
  var D;
  try { D = JSON.parse(document.getElementById('review-data').textContent); } catch (e) {
    document.getElementById('app').innerHTML = '<p class="empty">This page has no readable review data. Rebuild it with build_review.py.</p>';
    return;
  }
  var M = D.meta || {}, S = D.summary || {}, KEY = M.storage_key || 'exam-review';
  var QS = D.questions || [], LS = D.lessons || [];
  var QBY = {}, LBY = {}, UNIT = {}, HAB = {}, HAB_LESSON = {};
  QS.forEach(function (q) { QBY[String(q.id).toLowerCase()] = q; });
  LS.forEach(function (l, i) { l._n = i + 1; LBY[String(l.id).toLowerCase()] = l; (l.habits || []).forEach(function (h) { if (!HAB_LESSON[h]) HAB_LESSON[h] = l; }); });
  (D.units || []).forEach(function (u) { UNIT[u.id] = u; });
  (D.habits || []).forEach(function (h) { HAB[h.id] = h; });
  var CH1 = String.fromCharCode(1), CH2 = String.fromCharCode(2);
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function store(k, v) {
    try {
      if (v === undefined) return JSON.parse(localStorage.getItem(KEY + '-' + k) || 'null');
      localStorage.setItem(KEY + '-' + k, JSON.stringify(v));
    } catch (e) { }
    return null;
  }
  function fmt(n) { return String(Math.round(n * 100) / 100); }
  function plural(n, a, b) { return n + ' ' + (n === 1 ? a : b); }
  function dateText(iso) {
    if (!iso) return '';
    try { var d = new Date(iso + 'T12:00:00'); if (isNaN(d)) return iso; return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return iso; }
  }

  /* ---------- rich text: paragraphs, lists, bold, italic, code, math ---------- */
  function rtInner(s) {
    if (s == null || s === '') return '';
    var stash = [];
    function keep(h) { stash.push(h); return CH1 + (stash.length - 1) + CH2; }
    s = String(s).replace(/\r\n?/g, '\n');
    s = s.replace(/```([\w+#.-]*)[ \t]*\n([\s\S]*?)\n?```/g, function (m, lang, code) {
      return '\n\n' + keep('<pre class="code"' + (lang ? ' data-lang="' + esc(lang) + '"' : '') + '><code>' + esc(code) + '</code></pre>') + '\n\n';
    });
    s = s.replace(/`([^`\n]+)`/g, function (m, c) { return keep('<code>' + esc(c) + '</code>'); });
    s = s.replace(/\\\[([\s\S]+?)\\\]/g, function (m) { return keep('<span class="mathwrap" style="display:block">' + esc(m) + '</span>'); });
    s = s.replace(/\\\(([\s\S]+?)\\\)/g, function (m) { return keep(esc(m)); });
    function inline(t) {
      return esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<i>$2</i>');
    }
    var out = [];
    s.split(/\n\s*\n/).forEach(function (block) {
      var lines = block.split('\n').filter(function (l) { return l.trim() !== ''; });
      if (!lines.length) return;
      if (lines.length === 1 && new RegExp('^' + CH1 + '\\d+' + CH2 + '$').test(lines[0].trim()) && /^<pre/.test(stash[+lines[0].trim().slice(1, -1)])) { out.push(lines[0].trim()); return; }
      var para = [], list = null, tag = 'ul';
      function flushP() { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } }
      function flushL() { if (list) { out.push('<' + tag + '>' + list.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</' + tag + '>'); list = null; } }
      lines.forEach(function (l) {
        var m = /^\s*([-*]|\d+[.)])\s+(.*)$/.exec(l);
        if (m) { var t = /\d/.test(m[1]) ? 'ol' : 'ul'; flushP(); if (list && t !== tag) flushL(); if (!list) { list = []; tag = t; } list.push(m[2]); return; }
        if (list && /^\s{2,}\S/.test(l)) { list[list.length - 1] += ' ' + l.trim(); return; }
        flushL(); para.push(l.trim());
      });
      flushP(); flushL();
    });
    var html = out.join('');
    var re = new RegExp(CH1 + '(\\d+)' + CH2, 'g');
    for (var i = 0; i < 3 && re.test(html); i++) { re.lastIndex = 0; html = html.replace(re, function (m, n) { return stash[+n]; }); }
    return html;
  }
  function rt(s, cls) { var h = rtInner(s); return h ? '<div class="rt' + (cls ? ' ' + cls : '') + '">' + h + '</div>' : ''; }
  function rtLine(s) { return rtInner(s).replace(/^<p>([\s\S]*)<\/p>$/, '$1'); }
  function img(o) {
    if (!o || !o.src) return '';
    return '<figure class="fig"><img src="' + esc(o.src) + '" alt="' + esc(o.alt || '') + '"' + (o.width ? ' width="' + o.width + '" height="' + o.height + '"' : '') + '>' +
      (o.caption ? '<figcaption>' + rtLine(o.caption) + '</figcaption>' : '') + '</figure>';
  }
  function code(o) { return o && o.code != null ? '<pre class="code"' + (o.lang ? ' data-lang="' + esc(o.lang) + '"' : '') + '><code>' + esc(o.code) + '</code></pre>' : ''; }

  /* ---------- small helpers about questions ---------- */
  var VLABEL = { right: 'Right', partial: 'Partly right', wrong: 'Wrong', blank: 'Blank' };
  var TLABEL = { mc: 'Multiple choice', multi: 'Select all that apply', tf: 'True or false', num: 'Numeric', written: 'Written' };
  function isEst(q) { return q.earned !== null && typeof q.earned === 'object'; }
  function likely(q) { return isEst(q) ? q.earned.likely : q.earned; }
  function earnedText(q) {
    if (!isEst(q)) return fmt(q.earned) + ' of ' + fmt(q.points);
    var e = q.earned;
    return 'about ' + fmt(e.likely) + ' of ' + fmt(q.points) + (e.low !== e.high ? ', ' + fmt(e.low) + ' to ' + fmt(e.high) : '');
  }
  function conf(q) { return q.confidence || 'solid'; }
  function units(q) { return [].concat(q.unit || []).map(function (u) { return UNIT[u] ? UNIT[u].name : u; }); }
  function opts(q) { return q.type === 'tf' ? [{ key: 'T', text: 'True' }, { key: 'F', text: 'False' }] : (q.options || []); }
  function picks(o) { return o && o.choice != null ? [].concat(o.choice).map(String) : []; }
  function optLabel(q, k) { var o = opts(q).filter(function (x) { return x.key === k; })[0]; return q.type === 'tf' ? (o ? o.text : k) : k; }
  function qName(q) { return 'Q' + q.id; }
  function lName(l) { return 'Lesson ' + l._n; }

  /* ---------- top bar ---------- */
  $('#top-title').textContent = M.title || M.exam || 'Exam review';
  $('#top-sub').textContent = [M.course, dateText(M.taken)].filter(Boolean).join(' · ');
  $('#n-answers').textContent = QS.length;
  $('#n-lessons').textContent = LS.length;

  /* ---------- summary (shown above Your answers) ---------- */
  function fmt1(n) { return String(Math.round(n * 10) / 10); }
  function renderSummary() {
    var c = S.counts || {}, est = !!S.estimated, graded = M.kind === 'graded';
    var kick = (graded ? 'Graded exam review' : 'Practice exam review') + (M.taken ? ' · taken ' + dateText(M.taken) : '');
    var h = '<div class="sum-head"><p class="kicker">' + esc(kick) + '</p>' +
      '<h1>' + esc(M.exam || M.title) + '</h1>' +
      (M.intro ? rt(M.intro, 'sub') : '<p class="sub">' + (graded ? 'Your graded exam, marked by the instructor. Each question below shows your answer, the correct one and what to take from it.' : 'Your attempt, graded question by question. Start with the patterns, then work through the lessons.') + '</p>') + '</div>';
    var lo = S.pct_low, hi = S.pct_high, mid = S.pct_likely;
    h += '<div class="scorebox"><div class="score">' +
      '<p class="lbl">' + (est ? 'Estimated score' : graded ? 'Score from the instructor' : 'Score') + '</p>' +
      '<div class="big"><span class="num">' + (est ? '<small class="about">about </small>' : '') + mid + '<small>%</small></span>' +
      (est ? '<span class="rng">likely ' + lo + ' to ' + hi + '%</span>' : '') + '</div>' +
      '<div class="rbar" aria-hidden="true"><span class="band" style="left:' + lo + '%;width:' + Math.max(hi - lo, 0.8) + '%"></span><span class="pin" style="left:' + mid + '%"></span>' +
      '<span class="tick" style="left:0">0</span><span class="tick" style="left:50%">50</span><span class="tick" style="left:100%">100</span></div>' +
      '<p class="pts">' + (est ? 'about ' + fmt(S.likely) + ' of ' + fmt(S.points_total) + ' points, ' + fmt(S.low) + ' to ' + fmt(S.high) : fmt(S.likely) + ' of ' + fmt(S.points_total) + ' points') + '</p></div>' +
      '<ul class="tally">' +
      '<li class="good"><b>' + (c.right || 0) + '</b><span>right</span></li>' +
      '<li class="part"><b>' + (c.partial || 0) + '</b><span>partly right</span></li>' +
      '<li class="bad"><b>' + ((c.wrong || 0) + (c.blank || 0)) + '</b><span>wrong' + (c.blank ? ' (' + c.blank + ' blank)' : '') + '</span></li>' +
      '<li class="uns"><b>' + (c.unsure || 0) + '</b><span>unsure or guessed</span></li>' +
      (M.time && M.time.used_min ? '<li class="wide"><b>' + fmt(M.time.used_min) + ' min</b><span>' + (M.time.limit_min ? 'of ' + fmt(M.time.limit_min) + ' allowed' : 'used') + '</span></li>' : '') +
      '</ul></div>';
    if ((c.guessed_right || []).length) {
      var g = c.guessed_right;
      h += '<p class="note warn"><b>' + (g.length === 1 ? 'One right answer was' : g.length + ' right answers were') + ' a guess or unsure</b> (' + g.map(function (i) { return '<a href="#q-' + esc(i) + '">Q' + esc(i) + '</a>'; }).join(', ') + '). Count ' + (g.length === 1 ? 'it' : 'them') + ' as a weak spot, not as points you can rely on.</p>';
    }
    var ub = (S.units || []).map(function (u) {
      var r = u.possible ? u.earned / u.possible : 0;
      return '<li><div class="row"><span>' + esc(u.name) + '</span><span>' + fmt1(u.earned) + ' of ' + fmt1(u.possible) + ' pts</span></div><div class="bar"><i class="' + (r >= 0.8 ? '' : r >= 0.5 ? 'mid' : 'low') + '" style="width:' + Math.round(r * 100) + '%"></i></div></li>';
    }).join('');
    var hb = (S.habits || []).filter(function (x) { return x.questions.length; }).map(function (x) {
      var l = LBY[String(x.lesson || '').toLowerCase()];

  function promptFor(d) {
    var who = M.student_name ? M.student_name : 'The student';
    var head = 'You are a patient, exact tutor for ' + (M.course || 'this course') + '. ' + who + ' took ' + (M.exam || 'an exam') + (M.kind === 'graded' ? ' (a real exam the instructor graded; the instructor’s marks are final)' : ' (a practice exam)') +
      ' and is reviewing it on a page that shows each question with their answer, the correct answer and an explanation. The correct answers come from ' + (M.key_source || 'the answer key') + '.' +
      ((M.credit_rules || []).length ? ' Credit rules: ' + M.credit_rules.join(' ') : '') +
      '\n\nThey are asking about this item:\n\n' + itemContext(d.item) + '\n\n' +
      'Answer their question directly and correctly. Build the intuition first, then be precise. Use one to four short paragraphs of two or three sentences; you may use **bold**, simple lists with "- ", `code` and fenced code blocks for code. Write math as \\( \\) inline and \\[ \\] for display, with \\frac for fractions, and define every symbol you use. Tone: formal, concise and direct; never use em dashes. ' +
      'If they believe their answer deserved more credit, check it honestly against the key, the rubric and the credit rules, say plainly whether they have a point, and suggest asking the instructor when it is a judgment call. If the question goes beyond the course, answer from standard ' + (M.subject || 'subject') + ' knowledge and say so in one clause. Do not repeat their question.\n\nTheir question: ';
    return d.thread.map(function (m, i) { return { role: m.r === 'q' ? 'user' : 'assistant', content: i === 0 ? head + m.t : m.t }; });
  }
  function needsAnswer(d) { return d && d.thread && d.thread.length && d.thread[d.thread.length - 1].r === 'q'; }
  function answer(id) {
    var d = docs[id];
    if (!needsAnswer(d) || answering[id]) return Promise.resolve();
    answering[id] = true; streamText[id] = ''; delete errs[id]; emit();
    return getSample().then(function (s) {
      if (!s) throw { code: 'not_granted' };
      return s(promptFor(d), { cache: false, onText: function (u) { streamText[id] = u.text; paintStream(id); } });
    }).then(function (res) {
      var cur = docs[id]; delete answering[id]; delete streamText[id];
      if (!cur) { emit(); return; }
      var nd = JSON.parse(JSON.stringify(cur));
      nd.thread.push({ r: 'a', t: (res && res.text) || '', at: new Date().toISOString() });
      return put(id, nd);
    }).catch(function (e) {
      delete answering[id]; delete streamText[id];
      var c = e && e.code;
      errs[id] = c === 'not_granted' ? 'Answering needs permission for this page. Allow it when asked, or from the page’s Permissions menu, then try again.' :
        c === 'rate_limited' ? 'Too many requests just now. Try again in a minute.' : 'Could not get an answer right now. Try again.';
      emit();
    });
  }

  /* ---------- Ask: threads under their item ---------- */
  function itemEl(item) { var k = item.slice(0, 1), id = item.slice(2); return document.getElementById((k === 'q' ? 'q-' : 'lesson-') + id); }
  function idsFor(item) { return Object.keys(docs).filter(function (id) { return docs[id] && docs[id].item === item; }).sort(function (a, b) { return docs[a].created < docs[b].created ? -1 : 1; }); }
  function threadHtml(id) {
    var d = docs[id], h = '<div class="thread" data-id="' + esc(id) + '">';
    d.thread.forEach(function (m) { h += '<div class="msg ' + (m.r === 'q' ? 'q' : 'a') + '"><span class="who">' + (m.r === 'q' ? 'You' : 'Claude') + '</span>' + rt(m.t) + '</div>'; });
    if (answering[id]) h += '<div class="msg a wait"><span class="who">Claude</span><div class="rt stream"><p>Thinking…</p></div></div>';
    if (needsAnswer(d) && !answering[id]) {
      if (sampleState === 'none') h += '<p class="th-note">Saved. Answers appear when this page is opened as a published Claude artifact.</p>';
      else h += '<div class="th-acts"><button type="button" class="btn primary th-answer">Answer</button></div>';
    }
    if (errs[id]) h += '<p class="th-err">' + esc(errs[id]) + '</p>';
    h += '<div class="th-acts"><input type="text" class="th-follow" id="fu-' + esc(id) + '" placeholder="Follow-up question" autocomplete="off" aria-label="Follow-up question">' +
      '<button type="button" class="btn th-send">' + (sampleState === 'none' ? 'Save' : 'Ask') + '</button>' +
      (confirmDel[id] ? '<span class="th-note">Delete this thread?</span><button type="button" class="btn ghost th-del-yes">Delete</button><button type="button" class="btn ghost th-del-no">Keep</button>' : '<button type="button" class="btn ghost th-del">Delete</button>') +
      '</div></div>';
    return h;
  }
  var sigs = {};
  function renderThreads() {
    var items = {};
    $$('[data-item]').forEach(function (el) { items[el.dataset.item] = el; });
    Object.keys(items).forEach(function (item) {
      var ids = idsFor(item), box = items[item].querySelector('.qa');
      var sig = JSON.stringify(ids.map(function (id) { return [docs[id].thread.length, !!answering[id], errs[id] || '', !!confirmDel[id]]; })) + sampleState;
      if (sigs[item] === sig) return;
      sigs[item] = sig;
      var keepVals = {}; $$('.th-follow', box).forEach(function (i) { keepVals[i.id] = i.value; });
      box.hidden = !ids.length;
      box.innerHTML = ids.length ? '<p class="lbl">Your questions (' + ids.length + ')</p>' + ids.map(threadHtml).join('') : '';
      $$('.th-follow', box).forEach(function (i) { if (keepVals[i.id]) i.value = keepVals[i.id]; });
      ids.forEach(function (id) { if (answering[id]) paintStream(id); });
      typeset(box);
    });
    updateFab();
  }
  function paintStream(id) {
    var el = document.querySelector('.thread[data-id="' + id + '"] .stream');
    if (el && streamText[id]) el.innerHTML = rtInner(streamText[id]);
  }
  listeners.push(renderThreads);
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button') : null;
    if (!t) return;
    var th = t.closest('.thread'), id = th && th.dataset.id;
    if (t.classList.contains('th-answer')) answer(id);
    else if (t.classList.contains('th-send')) sendFollow(th);
    else if (t.classList.contains('th-del')) { confirmDel[id] = true; emit(); }
    else if (t.classList.contains('th-del-no')) { delete confirmDel[id]; emit(); }
    else if (t.classList.contains('th-del-yes')) { delete confirmDel[id]; del(id); }
    else if (t.classList.contains('ask-here')) { var it = t.closest('[data-item]'); openPop(it.dataset.item); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('th-follow')) { e.preventDefault(); sendFollow(e.target.closest('.thread')); } });
  function sendFollow(th) {
    var id = th.dataset.id, inp = th.querySelector('.th-follow'), v = inp.value.trim(), d = docs[id];
    if (!v || !d || answering[id]) return;
    var nd = JSON.parse(JSON.stringify(d));
    nd.thread.push({ r: 'q', t: v, at: new Date().toISOString() });
    inp.value = '';
    put(id, nd);
    if (sampleState !== 'none') answer(id);
  }

  /* ---------- Ask: the floating button and its box ---------- */
  var wrapEl = document.createElement('div');
  wrapEl.className = 'ask-wrap' + (sampleState === 'none' ? ' save-only' : '');
  wrapEl.innerHTML = '<div class="ask-pop" hidden role="dialog" aria-label="Ask a question">' +
    '<div class="ap-head"><label for="ap-target">About</label><input id="ap-target" type="text" placeholder="7 or L3" autocomplete="off" spellcheck="false"><span style="flex:1"></span><button type="button" class="ap-x" aria-label="Close">&times;</button></div>' +
    '<textarea id="ap-text" placeholder="What do you want to understand? For example: why is option B wrong?"></textarea>' +
    '<p class="ap-err" hidden></p>' +
    '<div class="ap-acts"><button type="button" class="btn ghost ask-save">Save for later</button><button type="button" class="btn primary ask-now">Ask Claude</button></div>' +
    '<p class="ap-note"></p></div>' +
    '<button type="button" class="ask-fab" aria-haspopup="dialog"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg><b>Ask</b><span class="af-t"></span></button>';
  document.body.appendChild(wrapEl);
  var pop = $('.ask-pop', wrapEl), fab = $('.ask-fab', wrapEl), tIn = $('#ap-target'), tx = $('#ap-text'), apErr = $('.ap-err', wrapEl);
  function paintPopNote() {
    var n = $('.ap-note', wrapEl); if (!n) return;
    n.textContent = sampleState === 'none' ? 'Your question is saved under the item. Answers appear when this page is opened as a published Claude artifact.' : 'The question is saved under the item, with Claude’s answer below it.';
    $('.ask-save', wrapEl).textContent = sampleState === 'none' ? 'Save question' : 'Save for later';
  }
  paintPopNote();
  var current = null;
  function labelFor(item) { if (!item) return ''; var id = item.slice(2); return item[0] === 'q' ? id : (LBY[id.toLowerCase()] ? 'L' + LBY[id.toLowerCase()]._n : id); }
  function nameFor(item) { if (!item) return ''; var id = item.slice(2).toLowerCase(); return item[0] === 'q' ? 'Q' + QBY[id].id : lName(LBY[id]); }
  function track() {
    var v = state.view === 'lessons' ? '#view-lessons .lesson' : '#view-answers .qcard:not([hidden])';
    var els = $$(v), top = document.querySelector('.top').getBoundingClientRect().bottom, line = top + (window.innerHeight - top) * 0.25, pick = els[els.length - 1] || null;
    for (var i = 0; i < els.length; i++) { if (els[i].getBoundingClientRect().bottom > line) { pick = els[i]; break; } }
    current = pick ? pick.dataset.item : null;
    updateFab();
  }
  var tq = 0;
  function queueTrack() { if (tq) return; tq = requestAnimationFrame(function () { tq = 0; track(); }); }
  function updateFab() {
    if (!fab) return;
    var t = $('.af-t', fab), n = current ? idsFor(current).length : 0;
    t.textContent = current ? 'about ' + nameFor(current) + (n ? ' (' + n + ')' : '') : '';
  }
  function parseTarget(s) {
    s = String(s || '').trim();
    var m = /^(?:l|lesson)\s*-?\s*(\d+)$/i.exec(s);
    if (m) { var l = LS[+m[1] - 1]; if (l) return 'l:' + l.id; }
    if (LBY[s.toLowerCase()]) return 'l:' + LBY[s.toLowerCase()].id;
    var q = /^(?:q|question|#)?\s*\.?\s*([A-Za-z0-9.-]+)$/i.exec(s);
    if (q && QBY[q[1].toLowerCase()]) return 'q:' + QBY[q[1].toLowerCase()].id;
    if (QBY[s.toLowerCase()]) return 'q:' + QBY[s.toLowerCase()].id;
    return null;
  }
  function openPop(item) {
    pop.hidden = false; apErr.hidden = true;
    tIn.value = labelFor(item || current);
    getSample();
    setTimeout(function () { tx.focus(); }, 0);
  }
  function closePop() { pop.hidden = true; }
  fab.addEventListener('click', function () { if (pop.hidden) openPop(); else closePop(); });
  $('.ap-x', wrapEl).addEventListener('click', closePop);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !pop.hidden) closePop(); });
  function submit(now) {
    var item = parseTarget(tIn.value), text = tx.value.trim();
    apErr.hidden = true;
    if (!item) { apErr.textContent = 'There is no question or lesson called “' + tIn.value.trim() + '”. Type a question number such as ' + (QS[0] ? QS[0].id : '1') + ', or a lesson such as L1.'; apErr.hidden = false; return; }
    if (!text) { apErr.textContent = 'Type your question first.'; apErr.hidden = false; tx.focus(); return; }
    var id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    put(id, { item: item, thread: [{ r: 'q', t: text, at: new Date().toISOString() }], created: new Date().toISOString() });
    tx.value = ''; closePop();
    var el = itemEl(item); reveal(el);
    if (now && sampleState !== 'none') answer(id);
  }
  $('.ask-now', wrapEl).addEventListener('click', function () { submit(true); });
  $('.ask-save', wrapEl).addEventListener('click', function () { submit(false); });
  tx.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(sampleState !== 'none'); } });

  /* ---------- wire up ---------- */
  renderSummary();
  renderAnswers();
  renderLessons();
  $$('#view-answers .chip').forEach(function (b) { b.addEventListener('click', function () { if (b.disabled) return; state.filter = b.dataset.f; applyFilter(); }); });
  $('#view-answers .sortbtn').addEventListener('click', function () { state.sort = state.sort === 'wrong' ? 'exam' : 'wrong'; applySort(); });
  applySort(); applyFilter();
  window.addEventListener('hashchange', route);
  window.addEventListener('scroll', queueTrack, { passive: true });
  window.addEventListener('resize', queueTrack);
  route();
  typeset($('#summary')); typeset($('#view-answers')); typeset($('#view-lessons'));
  renderThreads();
  if (S.has_math) loadMath();
  if (sampleState !== 'none') getSample();
  window.rvReview = {
    docs: function () { return docs; },
    state: function () { return { view: state.view, filter: state.filter, sort: state.sort, sample: sampleState, current: current, answering: Object.keys(answering), errs: errs }; },
    prompt: function (id) { return promptFor(docs[id]); },
    parseTarget: parseTarget
  };
})();

</script>
